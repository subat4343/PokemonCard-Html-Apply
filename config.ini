[SETTINGS]
# データソースを選択: 'spreadsheet' または 'config'
# spreadsheet: Googleスプレッドシートからアカウントとイベントリストを読み込む
# config: 従来通り、このファイルからアカウントを読み込み、TargetURLでイベントを検索する
DataSource = spreadsheet

; 実行モード (0: 通常モード, 1: 監視モード, 2: 通知モード)
OperationMode = 3

; 監視モード時のセッション維持チェック間隔（秒）
SessionCheckIntervalSeconds = 36000

# アカウント整理モード実行時の最大並列実行数（ブラウザの同時起動数）
MaxConcurrentBrowsers = 2

# アカウント整理モードで、過去イベントの出場結果を検索する際のイベント名
EventResultCheckName = ビクティニBWR争奪戦【3期】
 
# 監視したいポケモンカードのイベント検索ページのURL
# 例: "シティリーグ" で検索し、東京・神奈川を対象、受付中のみ表示、開催日が近い順
#TargetURL = https://players.pokemon-card.com/event/search?keyword=%E3%83%93%E3%82%AF%E3%83%86%E3%82%A3%E3%83%8B&prefecture=14&prefecture=13&prefecture=11&prefecture=12&prefecture=8&offset=0&accepting=true&order=1
TargetURL = https://players.pokemon-card.com/event/search?keyword=%E3%83%93%E3%82%AF%E3%83%86%E3%82%A3%E3%83%8B&prefecture=14&prefecture=13&prefecture=11&prefecture=12&prefecture=8&prefecture=46&offset=0&accepting=true&order=1
# イベントページでの張り付き時、応募可能かチェックする間隔（秒）
CheckIntervalSeconds = 1

# ページの描画や要素出現を待つ際の基本的な最大待機時間（秒）。
# ログイン処理や、イベント一覧ページの読み込み待ちで使用されます。
WaitTimeoutSeconds = 90

# [張り付き処理の待機時間設定]
# イベントページで「応募ボタン」が出現するかどうかをチェックする際の最大待機時間（秒）。
# 1回のチェックで最大何秒待つかを指定します。ネットワークが安定しているなら1秒などの短い時間で問題ありません。
ApplyCheckTimeoutSeconds = 1

# ブラウザを非表示で実行するか (True: 非表示 / False: 表示)
HeadlessMode = False

# 通知方法を選択 ('line' または 'discord')
NotificationMethod = discord

[SPREADSHEET]
# --- spreadsheetモードでのみ使用 ---
# アカウント管理用のスプレッドシート名とシート名
AccountBookName = ビクティニアカウント管理auto
AccountSheetName = シート1

# 応募対象イベント一覧用のスプレッドシート名とシート名
EventBookName = ビクティニイベント
EventSheetName = メイン

[EVENT_SEARCH]
Keyword = ビクティニ
# 都道府県コード（カンマ区切り、例: 東京=13, 神奈川=14, 大阪=27）
PrefectureList = 14,13,11,12,46

